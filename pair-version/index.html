<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Task Manager</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<main>
			<h1>Task Manager</h1>

			<form id="task-form">
				<label for="task-input">New task</label>
				<input type="text" id="task-input" name="task" placeholder="Enter a task" />
				<button type="submit">Add Task</button>
			</form>

			<nav aria-label="Task filters">
				<button type="button" data-filter="all">All</button>
				<button type="button" data-filter="active">Active</button>
				<button type="button" data-filter="completed">Completed</button>
			</nav>

			<ul id="task-list" aria-label="Tasks"></ul>
		</main>
		<script src="app.js"></script>
	</body>
</html>
